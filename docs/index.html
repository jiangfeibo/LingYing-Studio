<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>灵影 Studio · 课堂实例</title>
  <meta name="description" content="观看灵影 Studio 生成的两段完整数字人课堂：课件、讲解、教师画面与重点引导。">
  <style>
    :root{color-scheme:dark;--bg:#10111a;--text:#f1eff8;--muted:#aaa7bb;--accent:#b39bff;--line:#302c42}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}
    a{color:inherit;text-underline-offset:5px;transition:color .18s}a:hover{color:var(--accent)}a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:5px}
    nav{display:flex;justify-content:space-between;gap:20px;padding:22px 5vw;border-bottom:1px solid var(--line)}nav strong{letter-spacing:.04em}nav a{font-size:14px;color:var(--muted)}
    main{max-width:1240px;margin:auto;padding:42px 5vw 70px}.intro{animation:enter .45s ease-out}small,.muted{color:var(--muted)}h1{font-size:clamp(28px,5vw,48px);font-weight:600;letter-spacing:-.03em;line-height:1.3;margin:8px 0 10px}.intro p{max-width:640px;color:var(--muted);margin:0 0 28px}
    .choices{display:flex;gap:24px;flex-wrap:wrap;margin:0 0 25px;border-bottom:1px solid var(--line)}button{font:inherit;border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);padding:10px 0 12px;cursor:pointer;transition:color .18s,border-color .18s}button[aria-pressed=true]{color:var(--text);border-color:var(--accent)}button:hover{color:var(--accent)}
    .player{background:#000;line-height:0;animation:enter .6s ease-out}video{width:100%;aspect-ratio:16/9;display:block;object-fit:contain;background:#000}
    .caption{display:flex;justify-content:space-between;align-items:start;gap:20px;padding:20px 0 25px;border-bottom:1px solid var(--line)}h2{font-size:20px;line-height:1.4;margin:0 0 6px}.caption p{margin:0;font-size:14px;color:var(--muted)}.download{font-size:14px;white-space:nowrap;color:var(--accent)}
    footer{margin-top:28px;color:var(--muted);font-size:13px;max-width:850px}.failure{font-size:14px;color:var(--muted);margin-top:16px} [hidden]{display:none!important}
    @keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media(max-width:600px){nav{padding:18px 5vw}.caption{display:block}.download{display:inline-block;margin-top:14px}.choices{gap:14px}button{font-size:14px}}
  </style>
</head>
<body>
  <nav><strong>灵影 Studio <span class="muted">/ LingYing Studio</span></strong><a href="https://github.com/maolinqi/LingYing-Studio-Showcase">返回文章 ↗</a></nav>
  <main>
    <header class="intro"><small>真实课堂 · 完整视频 · 含声音</small><h1>先看一节课程。</h1><p>课件、人物讲解和重点引导，组成可观看的课程。点击播放后可开启声音或全屏观看。</p></header>
    <div class="choices" role="group" aria-label="选择课堂"><button id="choose-1" type="button" aria-pressed="true">01 · 大模型的涌现能力</button><button id="choose-2" type="button" aria-pressed="false">02 · 序列任务与序列标注</button></div>
    <div class="player"><video id="player" controls playsinline preload="metadata" poster="media/lesson-1-poster.png" aria-label="完整课堂视频" src="https://github.com/maolinqi/LingYing-Studio-Showcase/releases/download/showcase-20261014/classroom-example-1.mp4"></video></div>
    <div class="caption"><div><h2 id="lesson-title">大模型的涌现能力</h2><p id="lesson-description">08:04 · 1920 × 1080 · 课件、教师与字幕</p></div><a id="download" class="download" href="https://github.com/maolinqi/LingYing-Studio-Showcase/releases/download/showcase-20261014/classroom-example-1.mp4">下载完整 MP4 ↓</a></div>
    <p id="error" class="failure" role="status" hidden>视频暂时无法加载。可以使用“下载完整 MP4”取得原文件后观看。</p>
    <footer>两段视频由项目作者提供，为现有项目生成的课堂实例。V3 与 MiniMax H3 接入仍处于后续开发方向。课件、人物与标识权利由相应权利人保留。</footer>
    <noscript><p>完整课堂一可直接播放。<a href="https://github.com/maolinqi/LingYing-Studio-Showcase/releases/download/showcase-20261014/classroom-example-2.mp4">下载课堂二</a>。</p></noscript>
  </main>
  <script>
    const lessons=[{title:'大模型的涌现能力',description:'08:04 · 1920 × 1080 · 课件、教师与字幕'},{title:'序列到序列任务与序列标注',description:'05:09 · 1920 × 1080 · 课件、教师与重点聚焦'}];
    const player=document.getElementById('player');let current=0;
    function selectLesson(){const next=location.hash==='#lesson-2'?1:0;const lesson=lessons[next];document.getElementById('lesson-title').textContent=lesson.title;document.getElementById('lesson-description').textContent=lesson.description;[1,2].forEach(n=>document.getElementById('choose-'+n).setAttribute('aria-pressed',String(n===next+1)));if(current!==next){player.pause();player.src='https://github.com/maolinqi/LingYing-Studio-Showcase/releases/download/showcase-20261014/classroom-example-'+(next+1)+'.mp4';player.poster='media/lesson-'+(next+1)+'-poster.png';player.load();current=next;document.getElementById('error').hidden=true}document.getElementById('download').href=player.src}
    [1,2].forEach(n=>document.getElementById('choose-'+n).addEventListener('click',()=>{location.hash='lesson-'+n}));window.addEventListener('hashchange',selectLesson);player.addEventListener('error',()=>{document.getElementById('error').hidden=false});selectLesson();
  </script>
</body>
</html>
